name = "portail-cashflow"
main = "_worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "CASHFLOW_KV"
id = "106db6da016d49d2b480452f19bad695"
# Ajout de Workers AI pour la vectorisation
[ai]
binding = "AI"

# Ajout de Vectorize pour les cerveaux d'Éric et NyXia
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "univers-livres"
